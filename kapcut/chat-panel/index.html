<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KapCut Chat</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #0d1117; color: #e6edf3; display: flex; height: 100vh; }
  #side { width: 240px; border-right: 1px solid #30363d; padding: 12px; box-sizing: border-box; }
  #side h2 { font-size: 14px; margin: 0 0 12px; }
  button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  button.ghost { background: #21262d; border: 1px solid #30363d; }
  #sessions { list-style: none; padding: 0; margin: 12px 0; font-size: 12px; }
  #sessions li { padding: 6px; border-bottom: 1px solid #21262d; cursor: pointer; }
  #sessions li:hover { background: #161b22; }
  main { flex: 1; display: flex; flex-direction: column; padding: 16px; }
  #log { flex: 1; overflow-y: auto; border: 1px solid #30363d; border-radius: 8px; padding: 12px; background: #010409; }
  .msg { margin: 8px 0; white-space: pre-wrap; line-height: 1.5; }
  .user { color: #79c0ff; }
  .assistant { color: #e6edf3; }
  .tool { color: #d2a8ff; font-size: 12px; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; }
  #status { font-size: 12px; color: #8b949e; margin-top: 6px; }
</style>
</head>
<body>
<aside id="side">
  <h2>KapCut Chat</h2>
  <button id="new">+ New session</button>
  <ul id="sessions"></ul>
  <div id="status">OpenCode: checking…</div>
</aside>
<main>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="Ask the agent to edit the video project…" autocomplete="off">
    <button type="submit">Send</button>
    <button type="button" class="ghost" id="refresh">Refresh</button>
  </form>
</main>
<script>
let sessionId = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function j(method, url, body) {
  const r = await fetch(url, { method, headers: {"content-type":"application/json"}, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}

function render(messages) {
  const log = $("#log");
  log.innerHTML = "";
  for (const m of messages || []) {
    if (m.info?.role === "user") {
      const parts = (m.parts || []).filter(p => p.type === "text").map(p => p.text).join("\n");
      log.insertAdjacentHTML("beforeend", `<div class="msg user"><b>You:</b> ${esc(parts)}</div>`);
    } else if (m.info?.role === "assistant") {
      for (const p of m.parts || []) {
        if (p.type === "text") log.insertAdjacentHTML("beforeend", `<div class="msg assistant">${esc(p.text)}</div>`);
        if (p.type === "tool") log.insertAdjacentHTML("beforeend", `<div class="tool">tool: ${esc(p.tool || p.state?.tool || "")}</div>`);
      }
    }
  }
  log.scrollTop = log.scrollHeight;
}

async function listSessions() {
  try {
    await j("GET", "/api/sessions");
    $("#status").textContent = "OpenCode: connected";
  } catch (e) {
    $("#status").textContent = "OpenCode: " + e.message;
  }
}

$("#new").onclick = async () => {
  const s = await j("POST", "/api/session", {});
  sessionId = s?.id || s?.sessionID || s?.session?.id;
  if (sessionId) { $("#log").innerHTML = ""; await listSessions(); }
};

$("#refresh").onclick = async () => {
  if (!sessionId) return;
  render(await j("GET", `/api/session/${encodeURIComponent(sessionId)}/messages`));
};

$("#form").onsubmit = async e => {
  e.preventDefault();
  const input = $("#input");
  const text = input.value.trim();
  if (!text || !sessionId) return;
  input.value = "";
  await j("POST", `/api/session/${encodeURIComponent(sessionId)}/prompt`, { text });
  await new Promise(r => setTimeout(r, 1200));
  await $("#refresh").onclick();
};

listSessions();
</script>
</body>
</html>
